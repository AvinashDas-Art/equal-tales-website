name: Update reviews & deploy

# ---------------------------------------------------------------------------
# SETUP REQUIRED BEFORE THIS WORKFLOW CAN RUN (neither step can be done by an
# assistant on your behalf — both need your own GitHub/Google logins):
#
# 1. This repo must actually be pushed to GitHub. At the time this file was
#    added, the local repo had no remote configured. Create a GitHub repo and
#    `git push -u origin master` (or main) first.
#
# 2. Add a repo secret named FIREBASE_SERVICE_ACCOUNT with a Firebase service
#    account key, so the deploy step can authenticate:
#      Firebase Console -> equal-tales-storyline project -> Project settings
#      -> Service accounts -> Generate new private key. Copy the whole JSON
#      file's contents into GitHub: repo -> Settings -> Secrets and variables
#      -> Actions -> New repository secret -> name it FIREBASE_SERVICE_ACCOUNT.
#
# Until both are done, this workflow will simply fail (or not run at all,
# since schedule/dispatch triggers don't fire on a repo with no GitHub remote).
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch reviews
        run: python scripts/fetch_reviews.py

      - name: Commit updated reviews.json (if changed)
        id: commit
        run: |
          git config user.name "equal-tales-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/reviews.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add data/reviews.json
            git commit -m "chore: refresh reviews.json [automated]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: equal-tales-storyline
          channelId: live
